[workspace]
members = [
    "crates/addok-core",
    "crates/addok-index",
    "crates/addok-server",
    "crates/addok-cli",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["addok-rs contributors"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/carapace-foundry/addok-rs"
readme = "README.md"
description = "Fast, lightweight, single-binary French address geocoder replacing Python+Redis Addok."

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tokio = { version = "1.38", features = ["full"] }
rayon = "1.10"
deunicode = "1.6"
csv = "1.3"
flate2 = "1.0"
tantivy = "0.22"
rstar = "0.13"
clap = { version = "4.5", features = ["derive", "cargo"] }
axum = { version = "0.8", features = ["macros"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.5", features = ["cors", "trace"] }
indicatif = { version = "0.18", features = ["rayon"] }
toml = "0.8"
roaring = { version = "0.11", features = ["serde"] }
bincode = "1.3"
memmap2 = "0.9"
rustyline = "19.0"
