name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-release:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            binary_name: addok
            archive_ext: tar.gz
          - os: macos-13
            target: x86_64-apple-darwin
            binary_name: addok
            archive_ext: tar.gz
          - os: macos-latest
            target: aarch64-apple-darwin
            binary_name: addok
            archive_ext: tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            binary_name: addok.exe
            archive_ext: zip

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build release binary
        run: cargo build --release --bin addok --target ${{ matrix.target }}

      - name: Package archive (Unix)
        if: matrix.os != 'windows-latest'
        shell: bash
        run: |
          STAGING="addok-${{ github.ref_name }}-${{ matrix.target }}"
          mkdir -p "${STAGING}"
          cp "target/${{ matrix.target }}/release/addok" "${STAGING}/"
          cp README.md LICENSE-MIT LICENSE-APACHE "${STAGING}/"
          tar -czvf "${STAGING}.tar.gz" "${STAGING}"
          shasum -a 256 "${STAGING}.tar.gz" > "${STAGING}.tar.gz.sha256"

      - name: Package archive (Windows)
        if: matrix.os == 'windows-latest'
        shell: bash
        run: |
          STAGING="addok-${{ github.ref_name }}-${{ matrix.target }}"
          mkdir -p "${STAGING}"
          cp "target/${{ matrix.target }}/release/addok.exe" "${STAGING}/"
          cp README.md LICENSE-MIT LICENSE-APACHE "${STAGING}/"
          7z a "${STAGING}.zip" "${STAGING}"
          shasum -a 256 "${STAGING}.zip" > "${STAGING}.zip.sha256"

      - name: Upload binaries to Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            addok-${{ github.ref_name }}-${{ matrix.target }}.*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
